{% extends 'public/base_landing.html' %}

{% block meta_pagina %}
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/static/css/public/reserva.css?v3.2">
{% endblock %}

{% block pagina %}
<div class="row justify-content-center ag-cuerpo">
    <div class="col-lg-8 col-xl-7">
        <section class="ei-tarjeta" aria-labelledby="ei-titulo">
            <span class="ei-icono" aria-hidden="true"><i class="fas fa-link-slash"></i></span>
            <h1 id="ei-titulo" class="ag-producto ei-titulo">{{ t.ei_titulo }}</h1>
            <p class="ag-descripcion ei-texto">{{ t.ei_texto }}</p>
            <div class="ag-acciones ei-acciones">
                <a href="/mi-cita/" class="btn btn-success ld-agendar"><i class="fas fa-ticket" aria-hidden="true"></i><span>{{ t.ei_buscar }}</span></a>
                <a href="/" class="btn btn-light ag-boton-suave"><i class="fas fa-arrow-left" aria-hidden="true"></i><span>{{ t.ei_inicio }}</span></a>
            </div>
        </section>
        {% include 'public/parciales/ayuda.html' with ayuda_id='ei-ayuda-titulo' %}
    </div>
</div>
{% endblock %}
