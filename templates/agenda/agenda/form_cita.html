<div class="row g-2">
    <input type="hidden" name="action" value="agendar">
    <input type="hidden" name="pk" value="0">
    {% for field in form %}
        <div class="col-lg-{{ field.field.widget.attrs.col|default:'12' }}">
            <div class="mb-2">
                <label class="form-label small mb-1" for="id_{{ field.name }}">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
                <div class="invalid-feedback" id="errorMessage{{ field.name }}"></div>
            </div>
        </div>
    {% endfor %}
    <div class="col-lg-12">
        <div class="mb-2">
            <label class="form-label small mb-1" for="id_equipo">Equipo que atiende <span class="text-muted">(opcional)</span></label>
            <select name="equipo" id="id_equipo" class="select2">
                <option value="">Solo yo</option>
                {% for e in equipos %}
                    <option value="{{ e.pk }}">{{ e.nombre }} · {{ e.proyecto }}</option>
                {% endfor %}
            </select>
            <div class="form-text">Con equipo, los responsables entran como invitados y se verifica que estén libres.</div>
            <div class="invalid-feedback" id="errorMessageequipo"></div>
        </div>
    </div>
</div>

<div class="border-top my-3"></div>

<div class="d-flex justify-content-end">
    <button type="button" class="btn btn-danger btn-sm me-1" data-bs-dismiss="modal">
        <i class="fa fa-window-close me-1"></i>Cancelar
    </button>
    <button type="submit" id="submit" class="btn btn-success btn-sm">
        <i class="fa fa-calendar-check me-1"></i>Agendar
    </button>
</div>
{% include 'base_formulario_modal.html' %}
