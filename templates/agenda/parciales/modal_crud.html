<div class="modal fade" id="modalDetalle" tabindex="-1" aria-labelledby="modalNombre" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <form method="post" action="{{ ruta }}" class="form">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title" id="modalNombre"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body detalleProdModal"></div>
            </form>
        </div>
    </div>
</div>
