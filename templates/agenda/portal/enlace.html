<div class="row g-3 align-items-center">
    <div class="col-md-4 text-center">
        <img src="{{ qr }}" alt="Código QR del enlace de reserva" class="po-qr" width="180" height="180">
    </div>
    <div class="col-md-8">
        <p class="mb-1 fw-semibold">{{ producto.nombre }}</p>
        <p class="agenda-sub mb-3">Comparte este enlace o el QR: el cliente elige día y hora y recibe la cita con su videollamada.</p>
        <label class="form-label small mb-1" for="po-url">Enlace de reserva</label>
        <div class="input-group">
            <input type="text" class="form-control" id="po-url" value="{{ url }}" readonly>
            <button type="button" class="btn btn-primary" onclick="copiarEnlace('po-url')"><i class="fas fa-copy me-1"></i>Copiar</button>
        </div>
        {% if producto.sitio_web %}
            <p class="agenda-sub mt-3 mb-0">En el sitio del producto, agrega un botón «Agendar cita» que apunte a este enlace.</p>
        {% endif %}
    </div>
</div>
<div class="border-top my-3"></div>
<div class="d-flex justify-content-end">
    <a href="{{ qr }}" download="qr-{{ producto.slug }}.svg" class="btn btn-success btn-sm me-1"><i class="fas fa-download me-1"></i>Descargar QR</a>
    <button type="button" class="btn btn-danger btn-sm" data-bs-dismiss="modal"><i class="fa fa-window-close me-1"></i>Cerrar</button>
</div>
