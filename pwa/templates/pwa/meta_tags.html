<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="{{ nombreempresa|default:'Turno' }}">

<meta name="theme-color" content="#2874A6">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{ nombreempresa|default:'Turno' }}">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="/pwa/icono/180.png?v={{ pwa_icono_version }}">
<link rel="apple-touch-icon" sizes="152x152" href="/pwa/icono/152.png?v={{ pwa_icono_version }}">
<link rel="apple-touch-icon" sizes="180x180" href="/pwa/icono/180.png?v={{ pwa_icono_version }}">
<link rel="apple-touch-icon" sizes="192x192" href="/pwa/icono/192.png?v={{ pwa_icono_version }}">

{% if favicon %}
    <link rel="icon" type="image/png" href="{{ favicon }}">
{% else %}
    <link rel="icon" type="image/png" sizes="192x192" href="/static/images/icons/icon-192x192.png">
{% endif %}

<meta name="msapplication-TileColor" content="#2874A6">
<meta name="msapplication-TileImage" content="/pwa/icono/144.png?v={{ pwa_icono_version }}">

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('/serviceworker.js', {scope: '/'})
                .catch(function (err) { console.warn('SW registration failed:', err); });
        });
    }
</script>
